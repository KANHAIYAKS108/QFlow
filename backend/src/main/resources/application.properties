spring.application.name=qflow-backend

# Primary app settings
server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Local development DB (fast startup; MySQL is supported via profile or docker-compose)
spring.datasource.url=jdbc:h2:mem:qflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Security
jwt.secret=qflow-super-secret-key-for-local-development-only-change-me
jwt.expiration-ms=86400000

# WebSocket
spring.websocket.endpoint=/ws
spring.websocket.topic=/topic

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Optional MySQL profile example:
# spring.datasource.url=jdbc:mysql://localhost:3306/qflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
