version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: qflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: qflow
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: qflow
      MYSQL_PASSWORD: qflow
    ports:
      - '3306:3306'
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: qflow-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  mysql_data:
